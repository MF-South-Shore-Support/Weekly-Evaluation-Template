<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Launch Program — Weekly Work Log</title>
<style>
  :root{
    --ink:#233038;
    --ink-soft:#5b6b74;
    --navy:#26415a;
    --sage:#6f8f6a;
    --sage-deep:#4f6b4c;
    --gold:#c9a24b;
    --cream:#f7f4ec;
    --card:#ffffff;
    --line:#dcd6c8;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--cream);
    color:var(--ink);
    font-family:"Public Sans","Segoe UI",Arial,sans-serif;
    line-height:1.45;
    padding:24px 16px 60px;
  }
  .sheet{
    max-width:760px;
    margin:0 auto;
  }
  header.title-block{
    border-bottom:3px solid var(--navy);
    padding-bottom:16px;
    margin-bottom:20px;
  }
  header.title-block h1{
    font-size:1.5rem;
    margin:0 0 4px;
    color:var(--navy);
    font-weight:700;
    letter-spacing:0.2px;
  }
  header.title-block .sub{
    color:var(--ink-soft);
    font-size:0.95rem;
  }
  .goal-banner{
    background:var(--navy);
    color:#fdfaf3;
    border-radius:var(--radius);
    padding:14px 18px;
    margin:18px 0;
    font-size:0.98rem;
  }
  .goal-banner strong{
    display:block;
    font-size:0.72rem;
    text-transform:uppercase;
    letter-spacing:0.06em;
    color:var(--gold);
    margin-bottom:4px;
  }
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:18px 20px;
    margin-bottom:18px;
  }
  .field-row{
    display:flex;
    gap:16px;
    flex-wrap:wrap;
    margin-bottom:14px;
  }
  .field{
    flex:1 1 220px;
  }
  label.field-label{
    display:block;
    font-size:0.82rem;
    color:var(--ink-soft);
    margin-bottom:4px;
    font-weight:600;
  }
  input[type=text], input[type=date], textarea{
    width:100%;
    border:1px solid var(--line);
    border-radius:6px;
    padding:9px 10px;
    font-size:0.98rem;
    font-family:inherit;
    color:var(--ink);
    background:#fffefb;
  }
  textarea{resize:vertical;min-height:52px;}
  input:focus, textarea:focus{
    outline:2px solid var(--sage);
    outline-offset:1px;
  }

  /* Day tabs */
  .tabbar{
    display:flex;
    gap:6px;
    margin-bottom:16px;
    flex-wrap:wrap;
  }
  .tabbar button{
    flex:1 1 auto;
    min-width:90px;
    padding:10px 6px;
    border:1px solid var(--navy);
    background:#fff;
    color:var(--navy);
    border-radius:8px;
    font-family:inherit;
    font-weight:600;
    font-size:0.88rem;
    cursor:pointer;
  }
  .tabbar button.active{
    background:var(--navy);
    color:#fff;
  }
  .day-panel{display:none;}
  .day-panel.active{display:block;}

  h2.day-heading{
    font-size:1.15rem;
    color:var(--navy);
    margin:0 0 14px;
    border-bottom:2px solid var(--gold);
    padding-bottom:6px;
  }
  h3.section-heading{
    font-size:0.85rem;
    text-transform:uppercase;
    letter-spacing:0.05em;
    color:var(--sage-deep);
    margin:0 0 8px;
  }
  .job-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
    gap:6px 12px;
    margin-bottom:16px;
  }
  .job-grid label{
    display:flex;
    align-items:center;
    gap:7px;
    font-size:0.92rem;
    padding:3px 0;
  }
  .job-grid input[type=checkbox]{
    width:16px;height:16px;flex-shrink:0;
    accent-color:var(--sage-deep);
  }

  .reflect-q{
    margin-bottom:14px;
  }
  .reflect-q p.q-text{
    margin:0 0 6px;
    font-size:0.95rem;
    font-weight:600;
  }
  .choice-row{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
  }
  .choice-row label{
    border:1px solid var(--line);
    border-radius:20px;
    padding:6px 14px;
    font-size:0.88rem;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:6px;
    background:#fffefb;
  }
  .choice-row input{margin:0;accent-color:var(--sage-deep);}
  .choice-row input:checked + span{font-weight:700;color:var(--sage-deep);}

  footer.controls{
    display:flex;
    gap:10px;
    justify-content:flex-end;
    margin-top:10px;
    flex-wrap:wrap;
  }
  footer.controls button{
    font-family:inherit;
    font-size:0.9rem;
    font-weight:600;
    padding:10px 18px;
    border-radius:8px;
    cursor:pointer;
    border:1px solid var(--navy);
  }
  #printBtn{background:var(--navy);color:#fff;}
  #clearBtn{background:#fff;color:var(--navy);}

  .next-week .field{flex:1 1 300px;}

  /* Print: show every day stacked, hide chrome */
  @media print{
    body{background:#fff;padding:0;}
    .tabbar, footer.controls{display:none !important;}
    .day-panel{display:block !important;page-break-inside:avoid;margin-bottom:22px;}
    .card{border:1px solid #999;}
    .goal-banner{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  }
</style>
</head>
<body>
<div class="sheet">

  <header class="title-block">
    <h1>Launch Program — Weekly Work Log</h1>
    <div class="sub">Complete one section per work day, then export to PDF or print for your records.</div>
  </header>

  <div class="card">
    <div class="field-row">
      <div class="field">
        <label class="field-label" for="empName">Employee Name</label>
        <input type="text" id="empName" placeholder="Full name">
      </div>
      <div class="field">
        <label class="field-label" for="weekDate">Week / Date</label>
        <input type="text" id="weekDate" placeholder="e.g. Sept 8–12, 2026">
      </div>
    </div>
    <div class="field">
      <label class="field-label" for="personalGoal">Personal Work Goal</label>
      <textarea id="personalGoal" placeholder="This week I am working on..."></textarea>
    </div>
  </div>

  <div class="goal-banner">
    <strong>Launch Program Goal</strong>
    We reflect and evaluate our daily work skills in order to maintain our jobs.
  </div>

  <div class="tabbar" id="tabbar"></div>

  <div id="dayPanels"></div>

  <div class="card next-week">
    <h3 class="section-heading">Next Week's Preferred Jobs</h3>
    <div class="field-row">
      <div class="field">
        <label class="field-label" for="nextAM">AM Jobs</label>
        <textarea id="nextAM" placeholder="Preferred morning jobs for next week"></textarea>
      </div>
      <div class="field">
        <label class="field-label" for="nextPM">PM Jobs</label>
        <textarea id="nextPM" placeholder="Preferred afternoon jobs for next week"></textarea>
      </div>
    </div>
  </div>

  <footer class="controls">
    <button id="clearBtn" type="button">Clear Form</button>
    <button id="printBtn" type="button">Export to PDF</button>
  </footer>

</div>

<script>
const DAYS = ["Monday","Tuesday","Wednesday","Thursday","Friday"];

const MORNING_JOBS = ["COA","JJ's","Animal Shelter","Landscaping","Shopping","Fountain Lane",
  "Spare Studio","Meals on Wheels","Art Class","Arts + Rec Cleaning","COHO Cookies",
  "Hingham Library","Gardening"];

const AFTERNOON_JOBS = ["Landscaping","Farmers Market","Elm Street Cleaning","Fountain Lane",
  "Father Bill's","Healthy Snack","Recycling Club","Hingham Housing","YMCA","Writing Club","Gardening"];

const REFLECTION_QS = [
  {id:"energy", text:"1. How was your energy?", type:"choice", opts:["Low","Medium","High"]},
  {id:"completedJobs", text:"2. Did you complete your jobs today?", type:"choice", opts:["Yes","No"]},
  {id:"askedHelp", text:"3. Did you ask for help?", type:"choice", opts:["Yes","No"]},
  {id:"tookBreak", text:"4. Did you take a break?", type:"choice", opts:["Yes","No"]},
  {id:"walkedCommunity", text:"5. Did you walk in the community?", type:"choice", opts:["Yes","No"]},
  {id:"metGoal", text:"6. Did you meet your personal work goal?", type:"choice", opts:["Yes","No"]},
  {id:"rateDay", text:"7. I would rate today", type:"choice", opts:["1","2","3","4","5"]},
  {id:"challenges", text:"8. What challenges did you face?", type:"text"}
];

function buildJobGrid(dayId, prefix, jobs){
  return jobs.map((job,i)=>{
    const id = `${dayId}_${prefix}_${i}`;
    return `<label><input type="checkbox" id="${id}"><span>${job}</span></label>`;
  }).join("");
}

function buildReflection(dayId){
  return REFLECTION_QS.map(q=>{
    if(q.type==="choice"){
      const opts = q.opts.map(o=>{
        const id = `${dayId}_${q.id}_${o}`;
        return `<label><input type="radio" name="${dayId}_${q.id}" id="${id}" value="${o}"><span>${o}</span></label>`;
      }).join("");
      return `<div class="reflect-q"><p class="q-text">${q.text}</p><div class="choice-row">${opts}</div></div>`;
    } else {
      return `<div class="reflect-q"><p class="q-text">${q.text}</p><textarea id="${dayId}_${q.id}"></textarea></div>`;
    }
  }).join("");
}

const tabbar = document.getElementById("tabbar");
const panelsWrap = document.getElementById("dayPanels");

DAYS.forEach((day,idx)=>{
  const dayId = day.toLowerCase();

  const tabBtn = document.createElement("button");
  tabBtn.textContent = day;
  tabBtn.type = "button";
  tabBtn.dataset.day = dayId;
  if(idx===0) tabBtn.classList.add("active");
  tabBtn.addEventListener("click", ()=>{
    document.querySelectorAll(".tabbar button").forEach(b=>b.classList.remove("active"));
    document.querySelectorAll(".day-panel").forEach(p=>p.classList.remove("active"));
    tabBtn.classList.add("active");
    document.getElementById(`panel_${dayId}`).classList.add("active");
  });
  tabbar.appendChild(tabBtn);

  const panel = document.createElement("div");
  panel.className = "day-panel" + (idx===0 ? " active":"");
  panel.id = `panel_${dayId}`;
  panel.innerHTML = `
    <div class="card">
      <h2 class="day-heading">${day}</h2>
      <h3 class="section-heading">Morning Jobs</h3>
      <div class="job-grid">${buildJobGrid(dayId,"am",MORNING_JOBS)}</div>
      <h3 class="section-heading">Afternoon Jobs</h3>
      <div class="job-grid">${buildJobGrid(dayId,"pm",AFTERNOON_JOBS)}</div>
      <h3 class="section-heading">Reflection</h3>
      ${buildReflection(dayId)}
    </div>
  `;
  panelsWrap.appendChild(panel);
});

document.getElementById("printBtn").addEventListener("click", ()=>window.print());

document.getElementById("clearBtn").addEventListener("click", ()=>{
  if(!confirm("Clear all entries on this form?")) return;
  document.querySelectorAll('input[type=text], input[type=date], textarea').forEach(el=>el.value="");
  document.querySelectorAll('input[type=checkbox]').forEach(el=>el.checked=false);
  document.querySelectorAll('input[type=radio]').forEach(el=>el.checked=false);
});
</script>
</body>
</html>
